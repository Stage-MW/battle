<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTLE MW | АНАЛИЗ ВООРУЖЕНИЯ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #03070b;
            --primary: #ff2a5f;
            --primary-dim: rgba(255, 42, 95, 0.2);
            --secondary: #00e5ff;
            --glass-bg: linear-gradient(135deg, rgba(20, 10, 15, 0.75), rgba(10, 5, 8, 0.9));
            --glass-border: rgba(255, 42, 95, 0.2);
            --glass-reflection: rgba(255, 255, 255, 0.05);
            --border-glow: 0 0 20px rgba(255, 42, 95, 0.4);
            --text-main: #f0e6e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a0b12 0%, #030408 100%);
            color: var(--text-main);
            font-family: 'Jura', sans-serif;
            text-transform: uppercase;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 999;
        }

        /* --- НАВИГАЦИЯ --- */
        nav { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); position: relative; z-index: 10; border-bottom: 1px solid var(--primary-dim); }
        .nav-btn {
            background: var(--glass-bg); border: 1px solid var(--primary-dim); border-top: 1px solid var(--glass-reflection); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: var(--primary); padding: 12px 20px; font-family: 'Share Tech Mono'; font-size: 1rem;
            cursor: pointer; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); transition: all 0.3s ease; 
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(255, 42, 95, 0.15); border-color: var(--primary); box-shadow: var(--border-glow); text-shadow: 0 0 8px var(--primary); color: #fff; }
        
        .page { display: none; animation: fadeIn 0.4s ease-out forwards; max-width: 1600px; margin: 0 auto; padding: 20px; position: relative; z-index: 5;}
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* СЕТКА СРАВНЕНИЯ */
        .compare-grid { display: grid; grid-template-columns: 1fr 600px 1fr; gap: 20px; align-items: start; }
        .equip-card { background: var(--glass-bg); border: 1px solid var(--primary-dim); border-top: 1px solid var(--glass-reflection); border-left: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px) saturate(150%); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 42, 95, 0.05); padding: 20px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); }
        .equip-img-container { width: 100%; height: 180px; background: rgba(0,0,0,0.7); margin-bottom: 20px; background-size: contain; background-repeat: no-repeat; background-position: center; border: 1px solid rgba(255, 42, 95, 0.2); box-shadow: inset 0 0 30px #000; }
        
        .stats-table { width: 100%; border-collapse: collapse; }
        .stats-table td { padding: 9px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'Share Tech Mono'; font-size: 0.9rem; }
        .stat-name { color: #a09095; }
        .stat-value { text-align: right; font-weight: bold; font-size: 1.05rem; }
        .win { color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
        .lose { color: #555; opacity: 0.7; }
        .neutral { color: #aaa; }

        /* АНАЛИТИЧЕСКИЙ ЦЕНТР */
        .analytics-core { background: var(--glass-bg); border: 1px solid var(--primary-dim); border-top: 1px solid var(--glass-reflection); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 42, 95, 0.05); padding: 25px; clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); min-height: 200px; display: flex; flex-direction: column; }
        .verdict-header { text-align: center; font-size: 1.4rem; color: #fff; margin-bottom: 20px; border-bottom: 1px solid var(--primary-dim); padding-bottom: 10px; font-family: 'Jura'; font-weight: 700; letter-spacing: 2px; }
        
        /* ТАКТИЧЕСКИЕ БЛОКИ (ПЛЮСЫ / МИНУСЫ) */
        .analysis-cols { display: flex; gap: 15px; margin-bottom: 20px; }
        .analysis-col { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 15px; }
        .col-title { font-family: 'Jura'; font-weight: bold; color: var(--secondary); text-align: center; margin-bottom: 10px; border-bottom: 1px dashed rgba(0,229,255,0.3); padding-bottom: 5px;}
        
        .pro-item { color: #00e5ff; font-family: 'Share Tech Mono'; font-size: 0.9rem; margin-bottom: 8px; text-transform: none; line-height: 1.3;}
        .pro-item::before { content: "[+] "; font-weight: bold; }
        
        .con-item { color: #ff2a5f; font-family: 'Share Tech Mono'; font-size: 0.9rem; margin-bottom: 8px; text-transform: none; line-height: 1.3;}
        .con-item::before { content: "[-] "; font-weight: bold; }
        
        .range-block { margin-top: 15px; padding: 10px; background: rgba(0, 229, 255, 0.05); border-left: 3px solid var(--secondary); font-family: 'Share Tech Mono'; font-size: 0.9rem; text-transform: none; color: #e0f2f1;}

        .final-summary-block { margin-top: 15px; padding: 20px; text-align: center; border: 2px solid var(--primary); background: rgba(255, 42, 95, 0.05); clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); box-shadow: inset 0 0 20px rgba(255, 42, 95, 0.1); backdrop-filter: blur(10px); }

        /* КАТАЛОГ (АРСЕНАЛ) & КАТЕГОРИИ */
        .categories-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .cat-btn { background: rgba(10, 5, 8, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #a09095; padding: 8px 18px; font-family: 'Jura'; font-weight: bold; cursor: pointer; transition: 0.3s; border-radius: 4px; font-size: 0.95rem;}
        .cat-btn:hover, .cat-btn.active { border-color: var(--primary); color: #fff; background: rgba(255, 42, 95, 0.2); box-shadow: var(--border-glow); }
        
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .catalog-item { background: var(--glass-bg); border: 1px solid var(--primary-dim); border-top: 1px solid var(--glass-reflection); padding: 15px; cursor: pointer; position: relative; transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .catalog-item:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.7), var(--border-glow); }
        .catalog-item.selected { border-color: var(--secondary); box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); background: rgba(0, 229, 255, 0.1); }
        .catalog-item.selected::after { content: "СЛОТ 1"; position: absolute; top: 10px; right: 10px; background: var(--secondary); color: #000; font-family: 'Share Tech Mono'; padding: 3px 10px; font-weight: bold; box-shadow: 0 0 10px var(--secondary);}
        .catalog-item-img { height: 130px; background: rgba(0,0,0,0.8); margin-bottom: 15px; background-size: contain; background-repeat: no-repeat; background-position: center; border-bottom: 2px solid var(--primary-dim); }

        /* ВЛАДКА РЕЙТИНГА (ТИР-ЛИСТ) */
        .rating-container { max-width: 900px; margin: 0 auto; }
        .rating-item { display: flex; align-items: center; background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; padding: 15px 20px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); transition: 0.3s; }
        .rating-item:hover { border-color: rgba(255,255,255,0.3); transform: translateX(10px); background: rgba(255,255,255,0.05); }
        .rating-rank { font-size: 2rem; color: #fff; width: 60px; text-align: center; font-family: 'Jura'; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .rating-img { width: 100px; height: 60px; background-color: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin: 0 20px; background-size: contain; background-repeat: no-repeat; background-position: center; }
        .rating-info { flex-grow: 1; }
        .rating-bar-bg { width: 100%; height: 6px; background: #111; margin-top: 12px; border-radius: 3px; overflow: hidden; position: relative; }
        .rating-bar-fill { height: 100%; transition: width 1s ease-out; box-shadow: 0 0 10px currentColor; }
        .rating-score { font-size: 1.8rem; font-family: 'Share Tech Mono'; font-weight: bold; min-width: 80px; text-align: right; margin-left: 20px; }

        /* УВЕДОМЛЕНИЯ */
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: rgba(10, 5, 8, 0.95); border: 1px solid var(--secondary); color: var(--secondary); padding: 15px 20px; font-family: 'Share Tech Mono'; font-size: 0.9rem; text-align: center; opacity: 0; transform: translateY(20px); transition: 0.3s; box-shadow: 0 0 15px rgba(0,229,255,0.3); text-transform: uppercase; }

        @media (max-width: 1100px) {
            .compare-grid { display: flex; flex-direction: column; gap: 20px; }
            .equip-card { width: 100%; order: 1; }
            #card-equip-2 { order: 2; }
            .analytics-core { order: 3; width: 100%; margin-top: 10px; }
            .analysis-cols { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <nav>
        <button class="nav-btn" onclick="switchMainPage('page-compare')">АНАЛИЗАТОР</button>
        <button class="nav-btn active" onclick="switchMainPage('page-catalog')">БАЗА РАКЕТ</button>
        <button class="nav-btn" onclick="switchMainPage('page-rating')">ТИР-ЛИСТ</button>
    </nav>

    <!-- СТРАНИЦА 1: СРАВНЕНИЕ -->
    <main id="page-compare" class="page">
        <div class="compare-grid">
            <div class="equip-card" id="card-equip-1">
                <div class="equip-img-container" id="img-equip-1"></div>
                <h3 id="name-equip-1" style="margin-bottom:15px; color:#fff; text-align:center; font-size:1.3rem;"></h3>
                <table class="stats-table" id="stats-equip-1"></table>
            </div>
            
            <div class="analytics-core">
                <div class="verdict-header">ТАКТИЧЕСКИЙ РАЗБОР</div>
                <div id="verdict-screen" style="font-family: 'Share Tech Mono'; text-align: center; color: #a09095; margin-top: 10px;">
                    [ ВЫБЕРИТЕ ДВЕ РАКЕТЫ ИЗ БАЗЫ ]
                </div>
            </div>

            <div class="equip-card" id="card-equip-2">
                <div class="equip-img-container" id="img-equip-2"></div>
                <h3 id="name-equip-2" style="margin-bottom:15px; color:#fff; text-align:center; font-size:1.3rem;"></h3>
                <table class="stats-table" id="stats-equip-2"></table>
            </div>
        </div>
    </main>

    <!-- СТРАНИЦА 2: БАЗА ДАННЫХ -->
    <main id="page-catalog" class="page active">
        <div class="categories-bar" id="category-bar"></div>
        <div class="catalog-grid" id="catalog-content"></div>
    </main>

    <!-- СТРАНИЦА 3: ТИР-ЛИСТ -->
    <main id="page-rating" class="page">
        <div class="categories-bar" id="rating-category-bar"></div>
        <div class="rating-container" id="rating-content"></div>
    </main>

    <script>
        const CATEGORIES = ["Ракеты"];
        
        const STATS_LOGIC = {
            damage_burst: { label: "Урон за залп", higherIsBetter: true },
            dpm: { label: "Урон в минуту", higherIsBetter: true },
            reload: { label: "Перезарядка (сек)", higherIsBetter: false },
            lock_time: { label: "Время захвата (сек)", higherIsBetter: false },
            projectiles: { label: "Ракет за пуск", higherIsBetter: true },
            anti_jamming: { label: "Помехозащита", higherIsBetter: true },
            hp: { label: "Прочность (HP)", higherIsBetter: true },
            start_speed: { label: "Нач. скорость (уз)", higherIsBetter: true },
            max_speed: { label: "Скорость (уз)", higherIsBetter: true },
            accel_time: { label: "Время разгона (сек)", higherIsBetter: false },
            range: { label: "Дальность (км)", higherIsBetter: true }
        };

        // БАЗА ДАННЫХ ОЧИЩЕНА ОТ ПВО И ГРАНАТОМЕТОВ
        const DB = {
            "zircon": { name: "3M22 ZIRCON", category: "Ракеты", damage_burst: 41600, dpm: 289714, reload: 8.40, lock_time: 1.50, projectiles: 1, anti_jamming: 0, hp: 300, start_speed: 388, max_speed: 583, accel_time: 1.43, range: 15.60, img: "https://via.placeholder.com/400x150/111/ff2a5f?text=ZIRCON" },
            "yj15": { name: "YJ-15", category: "Ракеты", damage_burst: 37500, dpm: 257675, reload: 8.40, lock_time: 1.25, projectiles: 2, anti_jamming: 0, hp: 250, start_speed: 155, max_speed: 544, accel_time: 2.00, range: 13.87, img: "https://via.placeholder.com/400x150/111/ff2a5f?text=YJ-15" },
            "yj17": { name: "YJ-17", category: "Ракеты", damage_burst: 36400, dpm: 204533, reload: 10.50, lock_time: 1.00, projectiles: 1, anti_jamming: 1, hp: 375, start_speed: 97, max_speed: 583, accel_time: 1.79, range: 13.00, img: "https://via.placeholder.com/400x150/111/ff2a5f?text=YJ-17" }
        };

        // АВТОМАТИЧЕСКИЙ РАСЧЕТ РЕЙТИНГА 0-100
        function calculateRating(item) {
            let score = 20; // Базовый балл
            score += (item.dpm / 300000) * 15; // До 15 баллов за DPM
            score += (item.damage_burst / 50000) * 10; // До 10 баллов за разовый урон
            score += item.anti_jamming === 1 ? 25 : 0; // АБСОЛЮТНАЯ МЕТА: +25 баллов за игнор ловушек
            score += (item.hp / 400) * 10; // До 10 баллов за живучесть
            score += (item.start_speed / 400) * 10; // До 10 баллов за рывок
            score += (item.max_speed / 600) * 5; // До 5 баллов за максималку
            score += Math.max(0, (2.0 - item.lock_time) * 5); // Бонус за быстрый захват
            
            return Math.min(100, Math.round(score));
        }

        // Присваиваем рейтинг при запуске
        for (let key in DB) {
            DB[key].rating = calculateRating(DB[key]);
        }

        let currentCategory = "Ракеты";
        let compareQueue = [];

        function showToast(msg, isErr = false) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${isErr ? 'error' : ''}`; t.innerText = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; }, 10);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; setTimeout(() => t.remove(), 300); }, 2500);
        }

        function switchMainPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if(pageId === 'page-compare') document.querySelectorAll('.nav-btn')[0].classList.add('active');
            if(pageId === 'page-catalog') { document.querySelectorAll('.nav-btn')[1].classList.add('active'); compareQueue = []; renderCatalog(); }
            if(pageId === 'page-rating') { document.querySelectorAll('.nav-btn')[2].classList.add('active'); renderRatingList(); }
        }

        function initApp() {
            const catBar = document.getElementById('category-bar');
            const ratingCatBar = document.getElementById('rating-category-bar');
            
            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn active`; btn.innerText = cat;
                catBar.appendChild(btn);

                const rBtn = document.createElement('button');
                rBtn.className = `cat-btn active`; rBtn.innerText = cat;
                ratingCatBar.appendChild(rBtn);
            });
            renderCatalog();
        }

        function handleCatalogClick(itemId) {
            const item = DB[itemId];
            if (compareQueue.length === 0) {
                compareQueue.push(itemId); renderCatalog(); 
                showToast(`СЛОТ 1: ${item.name}`);
            } else if (compareQueue.length === 1) {
                if (compareQueue[0] === itemId) { compareQueue = []; renderCatalog(); return; }
                const id1 = compareQueue[0]; const id2 = itemId;
                
                updateEquipView(1, id1); updateEquipView(2, id2);
                runAnalysis(id1, id2);
                switchMainPage('page-compare');
                showToast("АНАЛИЗ ЗАВЕРШЕН");
                compareQueue = [];
            }
        }

        function renderCatalog() {
            const c = document.getElementById('catalog-content'); c.innerHTML = ''; 
            for (let key in DB) {
                const s = DB[key]; const sel = compareQueue.includes(key) ? 'selected' : '';
                c.innerHTML += `
                    <div class="catalog-item ${sel}" onclick="handleCatalogClick('${key}')">
                        <div class="catalog-item-img" style="background-image: url('${s.img}')"></div>
                        <div style="color:#fff; font-size:1.1rem; font-weight:bold; margin-bottom:8px; font-family:'Jura'">${s.name}</div>
                        <div style="color:#a09095; font-family:'Share Tech Mono'; font-size: 0.9rem; line-height: 1.5;">
                            DPM: <span style="color:var(--secondary)">${s.dpm.toLocaleString('ru')}</span><br>
                            РЕЙТИНГ МЕТЫ: <span style="color:#ffaa00">${s.rating}/100</span>
                        </div>
                    </div>`;
            }
        }

        function renderRatingList() {
            const c = document.getElementById('rating-content'); c.innerHTML = '';
            const items = Object.keys(DB).map(key => ({ id: key, ...DB[key] }));
            items.sort((a, b) => b.rating - a.rating);

            items.forEach((item, index) => {
                let color = 'var(--secondary)';
                if (item.rating >= 90) color = '#ffaa00'; 
                else if (item.rating < 80) color = '#a09095'; 

                setTimeout(() => {
                    const bar = document.getElementById(`bar-${item.id}`);
                    if(bar) bar.style.width = `${item.rating}%`;
                }, 50);

                c.innerHTML += `
                    <div class="rating-item">
                        <div class="rating-rank" style="color: ${color}">#${index + 1}</div>
                        <div class="rating-img" style="background-image: url('${item.img}')"></div>
                        <div class="rating-info">
                            <div style="color: #fff; font-family: 'Jura'; font-size: 1.3rem; font-weight: bold;">${item.name}</div>
                            <div class="rating-bar-bg"><div class="rating-bar-fill" id="bar-${item.id}" style="width: 0%; background: ${color}; color: ${color}"></div></div>
                        </div>
                        <div class="rating-score" style="color: ${color}">${item.rating}</div>
                    </div>`;
            });
        }

        function updateEquipView(side, itemId) {
            const item = DB[itemId];
            document.getElementById(`name-equip-${side}`).innerText = item.name;
            document.getElementById(`img-equip-${side}`).style.backgroundImage = `url('${item.img}')`;
            let html = '';
            for (let key in STATS_LOGIC) {
                let val = item[key];
                if (key === 'dpm' || key === 'damage_burst') val = val.toLocaleString('ru');
                if (key === 'anti_jamming') val = val === 1 ? "<span style='color:#ffaa00; text-shadow: 0 0 10px #ffaa00'>ЕСТЬ</span>" : "НЕТ";
                
                html += `<tr><td class="stat-name">${STATS_LOGIC[key].label}</td><td class="stat-value" id="val-${side}-${key}">${val}</td></tr>`;
            }
            document.getElementById(`stats-equip-${side}`).innerHTML = html;
        }

        // ГЕНЕРАТОР ТАКТИЧЕСКОГО РАЗБОРА (+ / - / Дистанция / Итог)
        function generateTactics(item) {
            let pros = []; let cons = []; let range = "";
            
            // Анализ плюсов и минусов
            if (item.anti_jamming === 1) pros.push("Абсолютная защита от ловушек (РЭБ)");
            else cons.push("Сбрасывается вражескими тепловыми ловушками");

            if (item.dpm > 250000) pros.push("Колоссальный базовый урон в минуту");
            else cons.push("Низкий математический DPM");

            if (item.start_speed >= 250) pros.push("Резкий старт (ПВО не успевает среагировать)");
            else cons.push("Медленный разгон на старте (уязвима в упор)");

            if (item.lock_time <= 1.2) pros.push("Мгновенный захват цели для спама");
            
            if (item.projectiles > 1) pros.push("Перегружает ПВО количеством снарядов");

            // Определение эффективной дистанции
            if (item.anti_jamming === 1) {
                range = "ДАЛЬНЯЯ / СРЕДНЯЯ (Гарантированно долетит до цели сквозь ПВО)";
            } else if (item.start_speed >= 250) {
                range = "БЛИЖНЯЯ (Кинжальный бой из-за укрытий, ПВО не успеет свестись)";
            } else {
                range = "СРЕДНЯЯ (Требуется поддержка союзного огня)";
            }

            // Формирование HTML
            let html = `<div class="analysis-col">
                <div class="col-title">${item.name}</div>
                <div>${pros.map(p => `<div class="pro-item">${p}</div>`).join('')}</div>
                <div style="margin-top:10px;">${cons.map(c => `<div class="con-item">${c}</div>`).join('')}</div>
                <div class="range-block"><b>ЭФФЕКТИВНОСТЬ:</b><br>${range}</div>
            </div>`;
            return html;
        }

        function runAnalysis(id1, id2) {
            const e1 = DB[id1]; const e2 = DB[id2];

            // Подсветка характеристик зеленым/красным
            for (let key in STATS_LOGIC) {
                const el1 = document.getElementById(`val-1-${key}`); const el2 = document.getElementById(`val-2-${key}`);
                el1.className = "stat-value"; el2.className = "stat-value";
                const v1 = parseFloat(e1[key]); const v2 = parseFloat(e2[key]);

                if (v1 === v2) { el1.classList.add('neutral'); el2.classList.add('neutral'); continue; }

                const isV1Better = STATS_LOGIC[key].higherIsBetter ? v1 > v2 : v1 < v2;
                if (isV1Better) { el1.classList.add('win'); el2.classList.add('lose'); } 
                else { el2.classList.add('win'); el1.classList.add('lose'); }
            }

            // Рендер столбцов плюсов/минусов
            let analysisCols = `<div class="analysis-cols">${generateTactics(e1)}${generateTactics(e2)}</div>`;
            
            // Финальный итог (сравнение рейтинга)
            let summaryText = "";
            if (Math.abs(e1.rating - e2.rating) < 5) {
                summaryText = `Обе ракеты показывают схожую боевую эффективность (Паритет: ${e1.rating} vs ${e2.rating}). Выбор зависит исключительно от дистанции ведения боя вашего корпуса.`;
            } else {
                const winner = e1.rating > e2.rating ? e1 : e2;
                const loser = e1.rating > e2.rating ? e2 : e1;
                let reason = winner.anti_jamming === 1 ? "наличия помехозащиты" : "огромного огневого потенциала (DPM/Скорость)";
                summaryText = `<span style="color:var(--secondary); font-size: 1.2rem;">ТАКТИЧЕСКОЕ ПРЕВОСХОДСТВО: ${winner.name}</span><br>В текущей мете данная ракета объективно сильнее за счет ${reason} (Рейтинг: ${winner.rating} vs ${loser.rating}).`;
            }

            let finalVerdictHTML = `<div class="final-summary-block"><div style="color:#fff; font-family:'Share Tech Mono'; font-size:0.95rem; line-height: 1.6; text-transform: none;">${summaryText}</div></div>`;
            
            document.getElementById('verdict-screen').innerHTML = analysisCols + finalVerdictHTML;
        }

        window.onload = initApp;
    </script>
</body>
</html>
